name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # ratchet:jdx/mise-action@v4
      - run: npm ci
      - run: just deps-ci

      - name: Validate
        run: just validate

      - name: Validate tag-URL contract
        run: just validate-tags

      - name: Build
        run: just build

      - name: Lint
        run: just lint

      - name: Test
        run: just test

      - name: Build README
        run: just build-readme
