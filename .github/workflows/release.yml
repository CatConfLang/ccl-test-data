name: Release Test Data

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        with:
          fetch-depth: 0 # Required for semantic-release to see full history

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # ratchet:actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install jv validator
        run: go install github.com/santhosh-tekuri/jsonschema/cmd/jv@latest

      - name: Validate JSON schemas
        run: |
          jv schemas/generated-format.json generated_tests/*.json

      - name: Extract version from tag
        id: version
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # ratchet:actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install semantic-release
        run: pip install python-semantic-release

      - name: Generate release notes
        id: changelog
        run: |
          # semantic-release generates .release_notes.md from the template
          semantic-release version --print-last-released-tag > /dev/null 2>&1 || true
          # Use Python to extract release notes for this version
          python3 << 'EOF'
          import re
          version = "${{ steps.version.outputs.version }}"
          with open("CHANGELOG.md", "r") as f:
              content = f.read()
          # Match from version header to next version header (or end)
          pattern = rf"## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)"
          match = re.search(pattern, content, re.DOTALL)
          if match:
              with open("RELEASE_NOTES.md", "w") as f:
                  f.write(match.group(1).strip())
          else:
              with open("RELEASE_NOTES.md", "w") as f:
                  f.write(f"Release {version}")
          EOF

      - name: Rewrite schema URLs in JSON files
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          SCHEMA_URL="https://raw.githubusercontent.com/${{ github.repository }}/${TAG}/schemas/generated-format.json"
          echo "Setting \$schema to: $SCHEMA_URL"

          mkdir -p release_assets

          for file in generated_tests/*.json; do
            filename=$(basename "$file")
            jq --arg schema "$SCHEMA_URL" '.["$schema"] = $schema' "$file" > "release_assets/$filename"
          done

      - name: Create generated tests ZIP archive
        run: |
          cd release_assets
          zip -r ../ccl-test-data-generated-${{ steps.version.outputs.tag }}.zip *.json

      - name: Create source tests ZIP archive
        run: |
          zip -r ccl-test-data-source-${{ steps.version.outputs.tag }}.zip source_tests/

      - name: Generate SHA256 checksums
        run: |
          sha256sum ccl-test-data-generated-${{ steps.version.outputs.tag }}.zip \
                    ccl-test-data-source-${{ steps.version.outputs.tag }}.zip \
                    > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # ratchet:softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "CCL Test Data ${{ steps.version.outputs.version }}"
          body_path: RELEASE_NOTES.md
          files: |
            release_assets/*.json
            ccl-test-data-generated-${{ steps.version.outputs.tag }}.zip
            ccl-test-data-source-${{ steps.version.outputs.tag }}.zip
            SHA256SUMS
          fail_on_unmatched_files: true
